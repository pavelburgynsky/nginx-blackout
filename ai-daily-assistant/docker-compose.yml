version: '3.8'

services:
  ai-assistant:
    build: .
    container_name: ai-daily-assistant
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
      - ./ai_assistant.db:/app/ai_assistant.db
    environment:
      - DATABASE_URL=sqlite:///./ai_assistant.db
    
